<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Replicathon</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/5807b9ec66.js" crossorigin="anonymous"></script>
</head>
<body>

    <main>
        <nav>
            <div class="logo">
                <img width="150px" src="logo.png" alt="Logo">
            </div>

            <div class="nav-links">
                <p>Home</p>
                <p>Products</p>
                <p>Contact</p>
                <button class="placeorder">
                    Place order
                    <img width="15px" src="placeOrder.svg" alt="">
                </button>
            </div>
        </nav>

        <section class="section1">
            <button class="buttonsec1">
                Products
            </button>
            <button class="buttonsec2">
                Custom
            </button>
        </section>

        <section class="main-section">
            <div class="left">
                <h1>FIND YOUR GREATNESS</h1>
                <p>Built for speed and confidence, every pair combines premium materials and bold design. Engineered for comfort, made for movement.</p>
            </div>

            <div class="mid">
                <h1>HYPE</h1>
                <img width="400px" src="shoe.png" class="shoe" alt="">
            </div>

            <div class="right">
                <p>Choose Your Color</p>
                <div class="circle">
                    <div class="circle1"></div>
                    <div class="circle2"></div>
                    <div class="circle3"></div>
                </div>

                <div class="numcircle">
                    <div class="numcircle1">40</div>
                    <div class="numcircle2">42</div>
                    <div class="numcircle3">44</div>
                </div>
        </section>


        <footer>
            <div class="icons">
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-pinterest"></i>
                <i class="fa-brands fa-youtube"></i>
            </div>

            <div class="text">
                <div class="line"></div>
                <p>SNEAKERS FOR MORE</p>
                <div class="line"></div>
            </div>

            <div class="seeall">
                <button class="seaall">
                    See all products
                    <img width="15px" src="arrow (1).svg" alt="">
                </button>
            </div>
        </footer>
    </main>
    
</body>
</html>
